# Every push and pull request: the host tests and the layers, the applications in the simulator
# against the pictures kept of them, the firmware built twice - for release, and for debugging
# with the development tools - and its size against the last build of main.
#
# Every push to main is a release, once the tests pass: the next version - VERSION, or the last
# release's with its patch one up, whichever is greater - with both builds and the files of a
# first flash for each. Its notes are the version's section of CHANGES.md when there is one,
# else the commits since the last release. The web flasher takes every release from this
# repository's Pages, made anew after a release. A push elsewhere builds the same, as
# <version>-<commit>, and releases nothing.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  actions: read

# One run of main at a time: each takes the version the one before released.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  WASI_SDK_URL: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.version.outputs.next }}
      build: ${{ steps.version.outputs.build }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          last=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1 | sed 's/^v//')
          next=$base
          if [ -n "$last" ]; then
            IFS=. read -r major minor patch <<< "$last"
            next=$(printf '%s\n%s\n' "$base" "$major.$minor.$((patch + 1))" | sort -V | tail -1)
          fi
          release=false
          build="$next-${GITHUB_SHA::7}"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            release=true
            build=$next
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "The build is $build; released: $release" >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: wasi-sdk
        run: |
          curl -sSL "$WASI_SDK_URL" | tar -xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: The tools
        run: tools/perinkpheral > /dev/null
      - name: Host tests and the layers
        run: make -C firmware/test/host test
      - name: The applications in the simulator
        run: tools/perinkpheral sim-test firmware/test/sim
      - name: The pictures that differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-pictures
          path: firmware/test/sim/**/*.actual.png
          if-no-files-found: ignore

  firmware:
    name: Firmware (${{ matrix.flavor }})
    needs: version
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        flavor: [release, debug]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: wasi-sdk
        shell: bash
        run: |
          curl -sSL "$WASI_SDK_URL" | tar -xz -C /opt
          echo "WASI_SDK_PATH=/opt/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: The tools
        shell: bash
        run: tools/perinkpheral > /dev/null
      - name: Build
        shell: bash
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          if [ "${{ matrix.flavor }}" = release ]; then
            # What a device updates itself to: no development tools.
            export APP_VERSION="${{ needs.version.outputs.build }}"
            idf.py -B build-release -D SDKCONFIG=build-release/sdkconfig \
                   -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.release" build
          else
            # The development tools in it; a device takes it for the release it is beside.
            export APP_VERSION="${{ needs.version.outputs.build }}-debug"
            idf.py -B build-debug -D SDKCONFIG=build-debug/sdkconfig \
                   -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults" build
          fi
          idf.py -B "build-${{ matrix.flavor }}" size --format csv > "../size-${{ matrix.flavor }}.txt"
      - name: The files of a first flash
        shell: bash
        run: |
          version="${{ needs.version.outputs.build }}"
          if [ "${{ matrix.flavor }}" = release ]; then
            tools/perinkpheral flash-manifest firmware/build-release flash "$version"
          else
            tools/perinkpheral flash-manifest firmware/build-debug flash "$version-debug" --prefix debug-
          fi
          # The numbers the size report compares: the image and the RAM it takes.
          image=$(stat -c %s flash/*perinkpheral.bin)
          diram=$(awk -F'","' '/^"DIRAM"/ { print $2; exit }' "size-${{ matrix.flavor }}.txt")
          printf 'image=%s\ndiram=%s\n' "$image" "$diram" > "size-${{ matrix.flavor }}.env"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.flavor }}
          path: flash
      - uses: actions/upload-artifact@v4
        with:
          name: size-${{ matrix.flavor }}
          path: size-${{ matrix.flavor }}.*

  size:
    name: Size
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: size-*
          path: now
          merge-multiple: true
      - name: Against the last build of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          slot=$((0x170000))
          before=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch main --status success \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$before" ]; then
            gh run download "$before" --repo "$GITHUB_REPOSITORY" --pattern 'size-*' --dir was || true
          fi
          {
            echo "### Firmware size"
            echo
            echo "| Build | Image | Against main | Free in the slot | RAM taken | Against main |"
            echo "|---|---|---|---|---|---|"
            for flavor in release debug; do
              . "now/size-$flavor.env"
              now_image=$image; now_diram=$diram
              was_image=""; was_diram=""
              if [ -f "was/size-$flavor/size-$flavor.env" ]; then
                . "was/size-$flavor/size-$flavor.env"; was_image=$image; was_diram=$diram
              fi
              delta() { [ -n "$2" ] && printf '%+d' $(($1 - $2)) || echo "-"; }
              free=$((slot - now_image))
              echo "| $flavor | $now_image | $(delta $now_image "$was_image") | $free ($((free * 100 / slot)) %) | $now_diram | $(delta $now_diram "$was_diram") |"
            done
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: On the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file report.md --edit-last || gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file report.md

  release:
    name: Release
    needs: [version, tests, firmware]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: v${{ needs.version.outputs.next }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.next }}
        run: |
          # The version's section of CHANGES.md, its heading aside; without one, the commits
          # since the last release.
          awk -v version="$VERSION" '
            /^## / { if (inside) exit; inside = ($2 == version); next }
            inside { print }
          ' CHANGES.md > notes.md
          if [ ! -s notes.md ]; then
            last=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
            git log --no-merges --format='- %s' ${last:+$last..}HEAD > notes.md
          fi
          printf '\nA first flash, for release or for debugging: https://perinkpheral.dev/flash. A device on its network updates itself from Device, Check for updates.\n' >> notes.md
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'firmware-*' --dir builds
          gh release create "v$VERSION" builds/firmware-release/* builds/firmware-debug/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md

  flasher:
    name: The flasher's files
    needs: release
    uses: ./.github/workflows/flasher.yml
