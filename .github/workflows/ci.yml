# Every push and pull request: the host tests and the layers, the applications in the simulator
# against the pictures kept of them, the firmware built twice - for release, and for debugging
# with the development tools - and its size against the last build of main.
#
# Every push to main is a release, once the tests pass: the next version - VERSION, or the last
# release's with its patch one up, whichever is greater - with both builds and the files of a
# first flash for each. Its notes are the version's section of CHANGES.md when there is one,
# else the commits since the last release. The web flasher takes every release from this
# repository's Pages, made anew after a release. A push elsewhere builds the same, as
# <version>-<commit>, and releases nothing.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  actions: read

# One run of main at a time: each takes the version the one before released.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  WASI_SDK_URL: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz

jobs:
  version:
    name: Version
    runs-on: [self-hosted, perinkpheral]
    outputs:
      next: ${{ steps.version.outputs.next }}
      build: ${{ steps.version.outputs.build }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          last=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1 | sed 's/^v//')
          next=$base
          if [ -n "$last" ]; then
            IFS=. read -r major minor patch <<< "$last"
            next=$(printf '%s\n%s\n' "$base" "$major.$minor.$((patch + 1))" | sort -V | tail -1)
          fi
          release=false
          build="$next-${GITHUB_SHA::7}"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            release=true
            build=$next
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "The build is $build; released: $release" >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests
    runs-on: [self-hosted, perinkpheral]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # the tools' libraries from the runner's Gradle home, not from Maven Central every run: it answers 429
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: wasi-sdk
        run: |
          # Kept in the runner's tool cache: 190 MB is not fetched again by every job.
          sdk="$RUNNER_TOOL_CACHE/wasi-sdk-34.0-x86_64-linux"
          if [ ! -x "$sdk/bin/clang" ]; then
            mkdir -p "$RUNNER_TOOL_CACHE"
            fresh=$(mktemp -d -p "$RUNNER_TOOL_CACHE")
            curl -sSL "$WASI_SDK_URL" | tar -xz -C "$fresh"
            mv -T "$fresh/wasi-sdk-34.0-x86_64-linux" "$sdk" || true
            rm -rf "$fresh"
          fi
          echo "WASI_SDK_PATH=$sdk" >> "$GITHUB_ENV"
      - name: The tools
        run: tools/perinkpheral > /dev/null
      - name: Host tests, frozen ABI and the layers
        run: make -C firmware/test/host test
      - name: Firmware and application update clients
        run: |
          tools/cli/gradlew -p tools/core check
          node firmware/test/web/test_firmware_update.js
          node firmware/test/web/test_app_requests.js
      - name: The applications in the simulator
        run: tools/perinkpheral sim-test firmware/test/sim
      - name: The pictures that differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-pictures
          path: firmware/test/sim/**/*.actual.png
          if-no-files-found: ignore

  case:
    name: Printable enclosure
    runs-on: [self-hosted, perinkpheral]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/case/requirements.txt
      - run: python -m pip install -r tools/case/requirements.txt
      - name: STEP conversion and committed print geometry
        run: python -m unittest discover -s tools/case -p 'test_*.py'

  firmware:
    name: Firmware (${{ matrix.flavor }})
    needs: version
    runs-on: [self-hosted, perinkpheral]
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        flavor: [release, debug]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # the tools' libraries from the runner's Gradle home, not from Maven Central every run: it answers 429
      # The container's own home is lost with it; this one is kept by the runner. One a
      # runner: two builds starting in one home at once failed to start Gradle.
      - run: echo "GRADLE_USER_HOME=$RUNNER_TOOL_CACHE/gradle-$RUNNER_NAME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: wasi-sdk
        shell: bash
        run: |
          # Kept in the runner's tool cache: 190 MB is not fetched again by every job.
          sdk="$RUNNER_TOOL_CACHE/wasi-sdk-34.0-x86_64-linux"
          if [ ! -x "$sdk/bin/clang" ]; then
            mkdir -p "$RUNNER_TOOL_CACHE"
            fresh=$(mktemp -d -p "$RUNNER_TOOL_CACHE")
            curl -sSL "$WASI_SDK_URL" | tar -xz -C "$fresh"
            mv -T "$fresh/wasi-sdk-34.0-x86_64-linux" "$sdk" || true
            rm -rf "$fresh"
          fi
          echo "WASI_SDK_PATH=$sdk" >> "$GITHUB_ENV"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: The tools
        shell: bash
        run: tools/perinkpheral > /dev/null
      - name: Build
        shell: bash
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          if [ "${{ matrix.flavor }}" = release ]; then
            # What a device updates itself to: no development tools.
            export APP_VERSION="${{ needs.version.outputs.build }}"
            idf.py -B build-release -D SDKCONFIG=build-release/sdkconfig \
                   -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.release" build
          else
            # The development tools in it; a device takes it for the release it is beside.
            export APP_VERSION="${{ needs.version.outputs.build }}-debug"
            idf.py -B build-debug -D SDKCONFIG=build-debug/sdkconfig \
                   -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults" build
          fi
          idf.py -B "build-${{ matrix.flavor }}" size --format csv > "../size-${{ matrix.flavor }}.txt"
      - name: The files of a first flash
        shell: bash
        run: |
          version="${{ needs.version.outputs.build }}"
          if [ "${{ matrix.flavor }}" = release ]; then
            tools/perinkpheral flash-manifest firmware/build-release flash "$version"
          else
            tools/perinkpheral flash-manifest firmware/build-debug flash "$version-debug" --prefix debug-
          fi
          # Read the slots from the same partition binary as the flash manifest.
          . "$IDF_PATH/export.sh"
          table="firmware/build-${{ matrix.flavor }}/partition_table/partition-table.bin"
          partition_size() {
            python "$IDF_PATH/components/partition_table/parttool.py" --quiet --partition-table-file "$table" \
              get_partition_info --partition-name "$1" --info size
          }
          main_slot=$(partition_size ota_0)
          recovery_slot=$(partition_size factory)
          test -n "$main_slot" && test -n "$recovery_slot"
          image=$(stat -c %s flash/*perinkpheral.bin)
          recovery_image=$(stat -c %s flash/*perink_recovery.bin)
          diram=$(awk -F'","' '/^"DIRAM"/ { print $2; exit }' "size-${{ matrix.flavor }}.txt")
          printf 'image=%s\ndiram=%s\nmain_slot=%s\nrecovery_slot=%s\nrecovery_image=%s\n' \
            "$image" "$diram" "$((main_slot))" "$((recovery_slot))" "$recovery_image" > "size-${{ matrix.flavor }}.env"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.flavor }}
          path: flash
      - name: Keep exact crash symbols
        run: |
          mkdir symbols
          tar -czf "symbols/symbols-${{ matrix.flavor }}.tar.gz" -C "firmware/build-${{ matrix.flavor }}" \
            perinkpheral.elf perinkpheral.map recovery/perink_recovery.elf recovery/perink_recovery.map
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ matrix.flavor }}
          path: symbols
      - uses: actions/upload-artifact@v4
        with:
          name: size-${{ matrix.flavor }}
          path: size-${{ matrix.flavor }}.*

  generated:
    name: Generated files and guides
    runs-on: [self-hosted, perinkpheral]
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      # The runner carries what this needs, installed once: build-essential for the
      # native preview; Chromium's libraries, poppler-utils and the guide's fallback
      # fonts (fonts-dejavu-core, fonts-liberation, fonts-noto-core) for PDF printing.
      # Departure Mono is read from assets/fonts.
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Committed generated files
        run: tools/perinkpheral check-generated
      - name: Guide limits and Russian translation
        run: |
          tools/perinkpheral check-api
          tools/perinkpheral check-limits docs/guide/source/guide.html
          tools/perinkpheral guide-units missing ru > "$RUNNER_TEMP/missing-ru.txt"
          if [ -s "$RUNNER_TEMP/missing-ru.txt" ]; then
            cat "$RUNNER_TEMP/missing-ru.txt"
            exit 1
          fi
      - name: The device page
        run: tools/perinkpheral page firmware/main/web "$RUNNER_TEMP/page.html" "$RUNNER_TEMP/page.html.gz"
      - name: Glyph packs and sheets
        run: tools/perinkpheral glyph-packs --out generated/glyphs --sheet generated/sheets
      - name: Both guides
        env:
          PDF_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          # Only local guide sources are printed. An isolated hosted runner has
          # no Chrome sandbox profile; keep its browser data in the run's scratch space.
          cat > "$RUNNER_TEMP/guide-chrome" <<'SH'
          #!/bin/sh
          exec "$PDF_CHROME" --no-sandbox --disable-dev-shm-usage --user-data-dir="$RUNNER_TEMP/guide-chrome-profile" "$@"
          SH
          chmod +x "$RUNNER_TEMP/guide-chrome"
          export CHROME="$RUNNER_TEMP/guide-chrome"
          tools/perinkpheral guide --out generated/perinkpheral-app-guide.pdf
          tools/perinkpheral guide --language ru --out generated/perinkpheral-app-guide.ru.pdf
      - name: Guides, glyph packs and sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: generated
          if-no-files-found: ignore

  size:
    name: Size
    needs: firmware
    runs-on: [self-hosted, perinkpheral]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: size-*
          path: now
          merge-multiple: true
      - name: Against the last build of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch main --status success \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$before" ]; then
            gh run download "$before" --repo "$GITHUB_REPOSITORY" --pattern 'size-*' --dir was || true
          fi
          {
            echo "### Firmware size"
            echo
            echo "| Build | Main image | Against previous | Free in main | Recovery image | Free in recovery | RAM taken | Against previous |"
            echo "|---|---|---|---|---|---|---|---|"
            for flavor in release debug; do
              . "now/size-$flavor.env"
              now_image=$image; now_recovery_image=$recovery_image; now_diram=$diram
              free=$((main_slot - now_image))
              recovery_free=$((recovery_slot - now_recovery_image))
              was_image=""; was_diram=""
              if [ -f "was/size-$flavor/size-$flavor.env" ]; then
                . "was/size-$flavor/size-$flavor.env"; was_image=$image; was_diram=$diram
              fi
              delta() { [ -n "$2" ] && printf '%+d' $(($1 - $2)) || echo "-"; }
              echo "| $flavor | $now_image | $(delta $now_image "$was_image") | $free | $now_recovery_image | $recovery_free | $now_diram | $(delta $now_diram "$was_diram") |"
            done
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: On the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file report.md --edit-last || gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file report.md

  release:
    name: Release
    needs: [version, tests, firmware, generated, case]
    if: needs.version.outputs.release == 'true'
    runs-on: [self-hosted, perinkpheral]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: v${{ needs.version.outputs.next }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.next }}
        run: |
          # The version's section of CHANGES.md, its heading aside; without one, the commits
          # since the last release.
          awk -v version="$VERSION" '
            /^## / { if (inside) exit; inside = ($2 == version); next }
            inside { print }
          ' CHANGES.md > notes.md
          if [ ! -s notes.md ]; then
            last=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
            git log --no-merges --format='- %s' ${last:+$last..}HEAD > notes.md
          fi
          printf '\nA first flash, for release or for debugging: https://perinkpheral.dev/flash. A device on its network updates itself from Firmware, Check for updates.\n' >> notes.md
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'firmware-*' --dir builds
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name documentation --dir documentation
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'symbols-*' --dir symbols
          gh release create "v$VERSION" builds/firmware-release/* builds/firmware-debug/* \
            documentation/*.pdf documentation/glyphs/*.glyphs \
            symbols/*/*.tar.gz hardware/step/rev1/*.step hardware/step/rev1/*.3mf hardware/step/rev1/*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md

  flasher:
    name: The flasher's files
    needs: release
    uses: ./.github/workflows/flasher.yml
