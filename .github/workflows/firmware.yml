# The firmware for release, and the files of a first flash: built by hand from
# the Actions tab. With "publish" on, they become the GitHub release
# v<version>, which the developer portal's web flasher writes and the device
# updates itself from; off, they are only the run's artifact.

name: Firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, such as 0.2.0
        required: true
      publish:
        description: Publish as the release v<version>
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: wasi-sdk
        run: |
          curl -sSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz \
            | tar -xz -C /opt
          echo "WASI_SDK_PATH=/opt/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: The version is the project's
        shell: bash
        run: |
          # Applications built now are stamped with VERSION as the least firmware
          # they run on: a release under another number would refuse them.
          if [ "$(tr -d '[:space:]' < VERSION)" != "${{ inputs.version }}" ]; then
            echo "VERSION says $(cat VERSION), the release ${{ inputs.version }}: set VERSION first" >&2
            exit 1
          fi
      - name: Build
        shell: bash
        working-directory: firmware
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-release -D SDKCONFIG=build-release/sdkconfig \
                 -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.release" build
      - name: The files of a first flash
        run: python3 tools/release/flash_manifest.py firmware/build-release flash "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: perinkpheral-${{ inputs.version }}
          path: flash

  release:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: perinkpheral-${{ inputs.version }}
          path: flash
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" flash/* \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "${{ inputs.version }}" \
            --notes "The firmware ${{ inputs.version }}. A first flash: https://perinkpheral.dev/flash. A device on its network updates itself from Device, Check for updates."
