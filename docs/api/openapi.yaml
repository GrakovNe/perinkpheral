openapi: 3.1.0
info:
  title: perINKpheral device API
  version: 0.1.30
  license:
    name: MIT
    identifier: MIT
  description: |
    The HTTP API of a perINKpheral device, served by the device itself on port 80.
    The device's web page uses it; so do the command line tools.

    Requests from pages of other sites are refused: a browser request must carry
    the device's own Origin, or none, and Host must name the device's address or
    hostname. The root page is public. Errors and plain confirmations are
    `{"error": "..."}` and `{"ok": "..."}`, but for a request refused for its origin,
    answered `Forbidden.` as text. Besides what each route lists, any of them may be
    answered 503 when the device is busy or short of memory, and 500 when its storage
    fails.

    Firmware updates, factory reset and a change of the Wi-Fi network wait for
    a press of OK on the device, up to a minute; installing a system application
    also requires this confirmation. The press must begin after the question
    reaches the panel. Unanswered is
    `403 {"error": "Not confirmed."}`.

    `/api/dev/*` exists only in firmware built with the development tools.
    There is no authentication. Origin and Host checks restrict browser requests;
    they do not authenticate command line clients. Update all and Refresh are
    page operations over the existing install and catalog routes, not endpoints.
servers:
  - url: http://{device}
    variables:
      device:
        default: perinkpheral-xxxx.local
        description: The device's name or address

tags:
  - name: Device
  - name: Settings
  - name: Apps
  - name: Catalogs
  - name: Glyphs
  - name: Firmware
  - name: Development

components:
  schemas:
    Ok:
      type: object
      properties:
        ok: { type: string, examples: ["Saved."] }
      required: [ok]
    Error:
      type: object
      properties:
        error: { type: string, examples: ["Invalid request."] }
      required: [error]
    Status:
      type: object
      properties:
        name: { type: string, description: Device name }
        firmware: { type: string, examples: ["0.1.30"] }
        supported_abis:
          type: array
          description: Explicit supported application ABI generations; membership, never a version ceiling.
          items: { type: integer, minimum: 1 }
          examples: [[3]]
        mode: { type: string, enum: [application, recovery] }
        ota_protocol: { type: integer, enum: [1] }
        partition_table: { type: integer, description: Image layout identifier }
        image_id: { type: string, description: Main image ELF SHA-256 in lowercase hexadecimal }
        boot_id: { type: integer, description: Recovery boot identity; changes after a restart }
        upload_state: { type: string, enum: [idle, receiving, confirming, writing, failed, restarting], description: Recovery only }
        slot: { type: string, examples: ["ota_0"] }
        on_probation: { type: boolean, description: A new image not confirmed yet }
        wifi: { type: string, enum: [online, connecting, setup, rescue] }
        ssid: { type: string }
        address: { type: string }
        tz: { type: string, description: POSIX TZ string }
        time: { type: string, description: "Local time, when known" }
        hostname: { type: string }
        idf: { type: string }
        built: { type: string }
        uptime_s: { type: integer }
        free_memory: { type: integer, description: Bytes }
        least_free_memory: { type: integer, description: "Bytes, since start" }
        reset_reason: { type: integer, description: "esp_reset_reason(): 3 restart, 4 fault, 5 interrupt watchdog" }
        last_panic: { type: string, description: "Record of the last fault, if any" }
        app_area_used: { type: integer }
        app_area: { type: integer }
        storage_ok: { type: boolean }
        storage_used: { type: integer, description: Bytes }
        storage_total: { type: integer, description: Bytes }
        largest_free_block: { type: integer, description: Bytes }
        usb_host: { type: boolean, description: A computer is on the USB cable }
        dev_tools: { type: boolean, description: The firmware has the development tools (/api/dev); absent otherwise }
        memory_refusals: { type: integer }
        failed_allocations: { type: integer }
    Settings:
      type: object
      description: >-
        Every field is optional on POST; what is sent is checked as a whole and stored. The keys
        are the settings' own. Unknown fields are ignored. Wi-Fi changes use /api/wifi.
        A change to device_name, ntp_server or language returns "Saved. Restart to apply.";
        it does not restart automatically.
        The system application API has a smaller explicit allowlist: it cannot access
        refresh_min_button_ms. See sdk/host/sys.h.
      properties:
        device_name: { type: string }
        hostname: { type: string, readOnly: true }
        wifi_ssid: { type: string, readOnly: true }
        ntp_server: { type: string }
        tz: { type: string, description: POSIX TZ string }
        tz_city: { type: string, description: "The city the zone was chosen by, by its English name; empty for a zone of its own" }
        refresh_min_data_s: { type: integer, minimum: 10, maximum: 3600, default: 60, description: Seconds between refreshes driven by data }
        refresh_full_every:
          type: integer
          anyOf: [{ minimum: 0, maximum: 50 }, { const: 255 }]
          default: 255
          description: "Full refresh after so many partial ones; 0 always full, 255 no periodic full refresh"
        refresh_keepalive_h: { type: integer, minimum: 1, maximum: 168, default: 24, description: Hours before a refresh is forced }
        dither: { type: boolean }
        font: { type: integer, description: "0 Departure Mono, 1 Jersey" }
        refresh_fast: { type: boolean }
        header_clock: { type: boolean, description: Time instead of the date in the header }
        time_auto: { type: boolean, description: Time from the network }
        power_saving: { type: integer, enum: [0, 1, 2], description: "0 off, 1 always, 2 auto" }
        default_app: { type: string }
        language: { type: string, examples: ["en", "ru"] }
        languages:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              code: { type: string }
              name: { type: string }
        menu_idle_min: { type: integer, minimum: 1, maximum: 60 }
        refresh_min_button_ms: { type: integer, minimum: 0, maximum: 10000, description: Least pause before answering a press }
        menu_order:
          type: array
          readOnly: true
          items: { type: string }
          description: >-
            The order the user set in the device's menu, by application name ("sys.settings" for a
            system one); an application not named comes first. Set on the device only.
    App:
      type: object
      properties:
        name: { type: string }
        title: { type: string }
        version: { type: string }
        description: { type: string, description: "Translated description, when provided" }
        icon: { type: array, items: { type: string }, description: 11 rows of 11 characters }
        hosts: { type: array, items: { type: string } }
        polls: { type: array, items: { type: object } }
        intents: { type: array, items: { type: string } }
        system: { type: boolean }
        writes_files: { type: boolean }
        fullscreen: { type: boolean }
        companion: { type: string }
        trusts: { type: array, items: { type: string }, description: Certificate authorities of its own }
        settings:
          type: array
          items: { $ref: "#/components/schemas/AppSetting" }
          description: As the manifest declares them, translated; hidden declarations are included
        values:
          type: object
          additionalProperties: { oneOf: [{ type: string }, { type: boolean }] }
          description: >-
            Stored values. A secret or custom link is returned only as set (true) or
            not (false). An absent link with a public manifest default returns that
            default as text; a stored empty link returns false and overrides the default.
            Hidden is a form rule, not a restriction on API reads or writes.
    AppSetting:
      type: object
      properties:
        key: { type: string }
        title: { type: string }
        type: { type: string, enum: [text, secret, number, choice, toggle, place, url, link, list] }
        hidden: { type: boolean, default: false, description: Omitted from the page form; writable through /api/apps/settings }
        help: { type: string }
        default: {}
        options: { type: array, items: { type: string } }
        labels: { type: array, items: { type: string }, description: "Translated choice labels, when available" }
        latitude: { type: string, description: Key of the latitude setting for a place }
        longitude: { type: string, description: Key of the longitude setting for a place }
    CatalogFile:
      type: object
      properties:
        name: { type: string }
        size: { type: integer }
        sha256: { type: string }
      required: [name, size, sha256]
  parameters:
    App:
      name: app
      in: query
      required: true
      schema: { type: string }
      description: Name of an installed application
  responses:
    Ok:
      description: Done
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Ok" }
    Error:
      description: Refused, with the reason
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Text:
      description: Plain text answer
      content:
        text/plain:
          schema: { type: string }

paths:
  /:
    get:
      tags: [Device]
      summary: The device's web page
      responses:
        "200":
          description: The page, gzip-compressed HTML
          content:
            text/html: {}

  /api/status:
    get:
      tags: [Device]
      summary: What the device is and how it is doing
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /api/log:
    get:
      tags: [Device]
      summary: The last 4 KB of the log
      parameters:
        - name: since
          in: query
          schema: { type: integer }
          description: The X-Log-End of the previous answer; only what came after it
      responses:
        "200":
          description: Log text
          headers:
            X-Log-End:
              schema: { type: integer }
              description: Where this answer ends, for the next `since`
            X-Log-Boot:
              schema: { type: integer }
              description: The run of the device the log is of; another after every restart
          content:
            text/plain:
              schema: { type: string }

  /api/restart:
    post:
      tags: [Device]
      summary: Restart
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/reset:
    post:
      tags: [Device]
      summary: Factory reset, confirmed on the device
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/settings:
    get:
      tags: [Settings]
      summary: The device's settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    post:
      tags: [Settings]
      summary: Change settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }

  /api/wifi:
    post:
      tags: [Settings]
      summary: Join another Wi-Fi network, confirmed on the device; the device restarts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ssid: { type: string }
                password: { type: string }
                tz: { type: string, description: "Time zone to set along, on a device that has none" }
                tz_city: { type: string, description: "The city the zone was chosen by, by its English name" }
              description: What is left out stays as it was
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/time:
    post:
      tags: [Settings]
      summary: Set the time zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tz: { type: string, description: POSIX TZ string, examples: ["MSK-3"] }
                tz_city: { type: string, description: "The city the zone was chosen by, by its English name; empty for a zone of its own" }
              required: [tz]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }

  /api/clock:
    post:
      tags: [Settings]
      summary: Set the clock by hand; refused while time comes from the network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                unix: { type: integer, description: "Unix seconds, from 2026 to before 2100; refused while the network's time is on" }
              required: [unix]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }

  /api/apps:
    get:
      tags: [Apps]
      summary: Installed applications with their settings
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/App" }

  /api/apps/settings:
    post:
      tags: [Apps]
      summary: Store settings of an application; it is told, its polls are fetched again
      parameters:
        - $ref: "#/components/parameters/App"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: string }
              description: >-
                Declared setting key to text value, including hidden settings. Missing
                keys are unchanged; an empty value is stored and overrides a default.
                Validation precedes writes, but writes are not transactional. Changing
                a url/link destination clears secrets omitted from this request.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "507":
          description: Not enough storage; what fitted is stored, and the application is told
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/apps/install:
    post:
      tags: [Apps]
      summary: Install or update an application from a catalog
      parameters:
        - name: source
          in: query
          required: true
          schema: { type: integer }
          description: Number of the catalog in /api/sources
        - name: app
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  minItems: 2
                  maxItems: 8
                  description: As the catalog's index lists them; app.wasm first, manifest.json last
                  items: { $ref: "#/components/schemas/CatalogFile" }
              required: [files]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: >-
            Not enough storage, or the application needs a newer firmware ("Update the firmware.",
            "firmware" of its manifest) or an unsupported ABI ("Update the app.").
            The downloaded manifest governs compatibility; the index is not authoritative.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/apps/remove:
    post:
      tags: [Apps]
      summary: Remove an application; what it stored stays unless forget=1
      parameters:
        - $ref: "#/components/parameters/App"
        - name: forget
          in: query
          schema: { type: integer, enum: [1] }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }

  /api/apps/removed:
    get:
      tags: [Apps]
      summary: Names of removed applications whose settings are kept
      responses:
        "200":
          description: Names
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /api/sources:
    get:
      tags: [Catalogs]
      summary: Catalog sources, the official one first
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources: { type: array, items: { type: string, format: uri } }
    post:
      tags: [Catalogs]
      summary: Set the added sources, up to three, https only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sources: { type: array, maxItems: 3, items: { type: string, format: uri } }
              required: [sources]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }

  /api/catalog:
    get:
      tags: [Catalogs]
      summary: The index of a source, passed on as it comes
      parameters:
        - name: source
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: catalog.json of the source
          content:
            application/json: {}
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/glyphs:
    get:
      tags: [Glyphs]
      summary: Installed glyph packs
      responses:
        "200":
          description: Packs
          content:
            application/json:
              schema:
                type: object
                properties:
                  packs:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        bytes: { type: integer }
                  free: { type: integer, description: Bytes left }
    post:
      tags: [Glyphs]
      summary: Install a glyph pack
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }

  /api/glyphs/remove:
    post:
      tags: [Glyphs]
      summary: Remove a glyph pack
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { $ref: "#/components/responses/Error" }

  /api/ota/recovery:
    post:
      tags: [Firmware]
      summary: Select recovery and restart; uploading there requires physical OK
      description: Refused while main is on probation. Does not erase the main image or user data.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/ota:
    post:
      tags: [Firmware]
      summary: Upload firmware in recovery; main returns 409 until recovery is entered
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/ota/release:
    post:
      tags: [Firmware]
      summary: Obsolete device-side downloader; returns 409, download through the browser instead
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                size: { type: integer }
              required: [url, size]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/dev/screen:
    get:
      tags: [Development]
      summary: The frame on the panel
      responses:
        "200":
          description: 1-bit BMP, 400 x 300
          headers:
            X-Frame: { schema: { type: integer }, description: How many frames the panel has shown since start }
            X-Pending: { schema: { type: string, enum: ["0", "1"] }, description: "1: a newer frame is on its way to the panel" }
          content:
            image/bmp: {}

  /api/dev/button:
    post:
      tags: [Development]
      summary: Press a button
      parameters:
        - name: button
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 4 }
          description: 1 up, 2 OK, 3 down, 4 back
        - name: press
          in: query
          schema: { type: string, enum: [short, long, down, up], default: short }
      responses:
        "200": { $ref: "#/components/responses/Text" }
        "400": { $ref: "#/components/responses/Text" }

  /api/dev/open:
    post:
      tags: [Development]
      summary: Put an installed application on the screen
      parameters:
        - name: app
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Text" }
        "404": { $ref: "#/components/responses/Text" }

  /api/dev/app:
    post:
      tags: [Development]
      summary: Upload one file of an application
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
          description: Application name
        - name: file
          in: query
          required: true
          schema: { type: string }
          description: File name, such as app.wasm or manifest.json
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "200": { $ref: "#/components/responses/Text" }
        "500": { $ref: "#/components/responses/Text" }

  /api/dev/run:
    post:
      tags: [Development]
      summary: Restart into an application
      parameters:
        - name: app
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Text" }

  /api/dev/kv:
    post:
      tags: [Development]
      summary: Write a value into an application's store
      parameters:
        - name: app
          in: query
          required: true
          schema: { type: string }
        - name: key
          in: query
          required: true
          schema: { type: string }
      requestBody:
        description: The value as it is; empty removes the key
        content:
          application/octet-stream: {}
      responses:
        "200": { $ref: "#/components/responses/Text" }
        "400": { $ref: "#/components/responses/Text" }
        "500": { $ref: "#/components/responses/Text" }

  /api/dev/flash:
    post:
      tags: [Development]
      summary: Upload a firmware image without a confirmation
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/dev/restart:
    post:
      tags: [Development]
      summary: Restart
      responses:
        "200": { $ref: "#/components/responses/Text" }

  /api/dev/sockets:
    get:
      tags: [Development]
      summary: Every socket of the device - its kind, the port here and the other end
      responses:
        "200": { $ref: "#/components/responses/Text" }

  /api/dev/crash:
    post:
      tags: [Development]
      summary: A deliberate fault, to test the fault record
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [wdt, abort] }
      responses:
        "400":
          description: Another kind. A known kind is not answered - the device faults and restarts
          content:
            text/plain: {}
